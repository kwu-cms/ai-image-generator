<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成履歴 - AI画像生成アプリ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ナビゲーションバー（Sticky Header） -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">AI画像生成アプリ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">画像生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="history.html">履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="guide.html">ガイド</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="user-info me-3" id="userInfo" style="display: none;">
                        <span id="userEmail" class="text-muted me-2"></span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">ログアウト</button>
                    </span>
                    <a href="login.html" id="loginLink" class="btn btn-primary btn-sm">ログイン</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <main>
            <section class="card shadow-custom fade-in-up">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <span class="text-gradient">生成履歴</span>
                    </h2>
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">読み込み中...</span>
                        </div>
                        <p class="mt-3">履歴を読み込み中...</p>
                    </div>
                    <div id="historyContainer" style="display: none;">
                        <div id="historyList" class="row g-3"></div>
                        <div id="emptyMessage" class="text-center py-5" style="display: none;">
                            <p class="text-muted mb-3">まだ画像が生成されていません。</p>
                            <a href="index.html" class="btn btn-primary">画像を生成する</a>
                        </div>
                    </div>
                    <div id="errorSection" style="display: none;">
                        <div class="alert alert-danger mt-3" id="errorMessage" role="alert"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="text-center text-muted mt-5 py-3">
            <p>&copy; 2024 AI画像生成アプリ</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/history.js"></script>
</body>

</html>
