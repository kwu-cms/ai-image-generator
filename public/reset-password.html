<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - Gen-Image.ai</title>
    <!-- Google Fonts: Noto Sans Japanese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ナビゲーションバー（Sticky Header） -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <div class="d-flex flex-column">
                    <span class="brand-title">Gen-Image.ai</span>
                    <span class="brand-subtitle">画像生成を通じてAIと対話する</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">画像生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="guide.html">ガイド</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="docs.html">ドキュメント</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">ログイン</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <!-- ログイン済み: アカウントドロップダウン -->
                    <div class="dropdown" id="userDropdown" style="display: none;">
                        <button class="btn btn-outline-primary btn-sm dropdown-toggle d-flex align-items-center" type="button" id="userDropdownToggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <svg class="icon icon-only me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span class="user-email"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdownToggle">
                            <li><h6 class="dropdown-header"><span class="user-email"></span></h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="settings.html">
                                <svg class="icon me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                設定
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;">
                                <svg class="icon me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                ログアウト
                            </a></li>
                        </ul>
                    </div>
                    <!-- 未ログイン: ログインボタン -->
                    <a href="login.html" id="loginLink" class="btn btn-primary btn-sm">ログイン</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <main>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <!-- ステップ1: リセットリクエスト -->
                    <section id="requestSection" class="card shadow-custom fade-in-up">
                        <div class="card-body">
                            <h2 class="card-title mb-4 text-center">
                                <span class="text-gradient">パスワード再設定</span>
                            </h2>
                            <p class="text-muted text-center mb-4">
                                メールアドレスを入力してください。パスワード再設定のリンクを送信します。
                            </p>
                            <form id="resetRequestForm">
                                <div class="form-group mb-4">
                                    <label for="email" class="form-label">メールアドレス</label>
                                    <input 
                                        type="email" 
                                        class="form-control"
                                        id="email" 
                                        name="email" 
                                        placeholder="k1234567"
                                        required
                                        maxlength="30"
                                        autocomplete="username"
                                    />
                                    <small class="form-text">入力すると自動的に@konan-wu.ac.jpが追加されます（例: ka225053, k1524005, takawo）</small>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" id="requestBtn" class="btn btn-primary btn-lg">
                                        再設定リンクを送信
                                    </button>
                                </div>
                            </form>
                            <div class="text-center mt-4">
                                <p class="text-muted"><a href="login.html" class="fw-semibold">ログインページに戻る</a></p>
                            </div>
                            <div id="errorSection" style="display: none;">
                                <div class="alert alert-danger mt-3 fade-in-up" id="errorMessage" role="alert"></div>
                            </div>
                            <div id="successSection" style="display: none;">
                                <div class="alert alert-success mt-3 fade-in-up" id="successMessage" role="alert"></div>
                            </div>
                        </div>
                    </section>

                    <!-- ステップ2: パスワード再設定 -->
                    <section id="resetSection" class="card shadow-custom fade-in-up" style="display: none;">
                        <div class="card-body">
                            <h2 class="card-title mb-4 text-center">
                                <span class="text-gradient">新しいパスワードを設定</span>
                            </h2>
                            <form id="resetPasswordForm">
                                <input type="hidden" id="resetToken" name="resetToken" />
                                <div class="form-group mb-4">
                                    <label for="newPassword" class="form-label">新しいパスワード</label>
                                    <input 
                                        type="password" 
                                        class="form-control"
                                        id="newPassword" 
                                        name="newPassword" 
                                        placeholder="4文字以上12文字以下"
                                        required
                                        minlength="4"
                                        maxlength="12"
                                        autocomplete="new-password"
                                    />
                                    <small class="form-text">4文字以上12文字以下で入力してください</small>
                                </div>
                                <div class="form-group mb-4">
                                    <label for="newPasswordConfirm" class="form-label">新しいパスワード（確認）</label>
                                    <input 
                                        type="password" 
                                        class="form-control"
                                        id="newPasswordConfirm" 
                                        name="newPasswordConfirm" 
                                        placeholder="同じパスワードを入力"
                                        required
                                        minlength="4"
                                        maxlength="12"
                                        autocomplete="new-password"
                                    />
                                </div>
                                <div class="d-grid">
                                    <button type="submit" id="resetBtn" class="btn btn-primary btn-lg">
                                        パスワードを再設定
                                    </button>
                                </div>
                            </form>
                            <div class="text-center mt-4">
                                <p class="text-muted"><a href="login.html" class="fw-semibold">ログインページに戻る</a></p>
                            </div>
                            <div id="resetErrorSection" style="display: none;">
                                <div class="alert alert-danger mt-3 fade-in-up" id="resetErrorMessage" role="alert"></div>
                            </div>
                            <div id="resetSuccessSection" style="display: none;">
                                <div class="alert alert-success mt-3 fade-in-up" id="resetSuccessMessage" role="alert"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="text-center text-muted mt-5 py-3">
            <p>&copy; 2024 Gen-Image.ai</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/email-autocomplete.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
