<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Image.ai</title>
    <!-- Google Fonts: Noto Sans Japanese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .icon {
            width: 1.25rem;
            height: 1.25rem;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        .icon-only {
            margin-right: 0;
        }
    </style>
</head>

<body>
    <!-- ナビゲーションバー（Sticky Header） -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <div class="d-flex flex-column">
                    <span class="brand-title">Gen-Image.ai</span>
                    <span class="brand-subtitle">画像生成を通じてAIと対話する</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">画像生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">履歴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="guide.html">ガイド</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <!-- ログイン済み: アカウントドロップダウン -->
                    <div class="dropdown" id="userDropdown" style="display: none;">
                        <button class="btn btn-outline-primary btn-sm dropdown-toggle d-flex align-items-center"
                            type="button" id="userDropdownToggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <svg class="icon icon-only me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span class="user-email"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdownToggle">
                            <li>
                                <h6 class="dropdown-header"><span class="user-email"></span></h6>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="settings.html">
                                    <svg class="icon me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                                        </path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    設定
                                </a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout(); return false;">
                                    <svg class="icon me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                        </path>
                                    </svg>
                                    ログアウト
                                </a></li>
                        </ul>
                    </div>
                    <!-- 未ログイン: ログインボタン -->
                    <a href="login.html" id="loginLink" class="btn btn-primary btn-sm">ログイン</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <main>
            <!-- 画像生成セクション -->
            <section class="card shadow-custom mb-4 fade-in-up">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <span class="text-gradient">画像を生成</span>
                    </h2>
                    <form id="generateForm">
                        <div class="form-group mb-4">
                            <label for="prompt" class="form-label">
                                プロンプト（画像の説明を入力）
                            </label>
                            <textarea class="form-control" id="prompt" name="prompt" rows="5"
                                placeholder="例: 美しい夕日の風景、山と湖、アニメスタイル&#10;詳細な説明を入力すると、より良い画像が生成されます..."
                                required></textarea>
                            <small class="form-text">できるだけ具体的に描写してください</small>
                        </div>
                        <button type="submit" id="generateBtn" class="btn btn-primary btn-lg">
                            <span id="generateBtnIcon"></span>画像を生成
                        </button>
                    </form>
                </div>
            </section>

            <!-- 生成結果セクション -->
            <section class="card shadow-custom mb-4 fade-in-up" id="resultSection" style="display: none;">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <span class="text-gradient">生成結果</span>
                    </h2>
                    <div id="resultContent">
                        <div class="text-center py-5" id="loading" style="display: none;">
                            <div class="spinner-border text-primary pulse" role="status"
                                style="width: 3rem; height: 3rem;">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                            <p class="mt-4 fw-semibold text-muted">画像を生成中... しばらくお待ちください</p>
                        </div>
                        <div id="resultImageContainer" class="mb-4"></div>
                        <div id="resultPrompt" class="alert alert-info"></div>
                    </div>
                </div>
            </section>

            <!-- エラーセクション -->
            <section id="errorSection" style="display: none;">
                <div class="alert alert-danger" id="errorMessage" role="alert"></div>
            </section>

            <!-- 全画像一覧セクション -->
            <section class="card shadow-custom mb-4 fade-in-up" id="allImagesSection">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <span class="text-gradient">生成された画像一覧</span>
                    </h2>
                    <div id="imagesLoading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">読み込み中...</span>
                        </div>
                        <p class="mt-3 text-muted">画像を読み込み中...</p>
                    </div>
                    <div id="imagesContainer" style="display: none;">
                        <div id="imagesList" class="row g-3"></div>
                        <div id="emptyImagesMessage" class="text-center py-5" style="display: none;">
                            <p class="text-muted mb-3">まだ画像が生成されていません。</p>
                            <p class="text-muted">ログインして画像を生成してみましょう！</p>
                        </div>
                    </div>
                    <div id="imagesErrorSection" style="display: none;">
                        <div class="alert alert-warning mt-3" id="imagesErrorMessage" role="alert"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="text-center text-muted mt-5 py-3">
            <p>&copy; 2024 Gen-Image.ai</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        // アイコンを挿入
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtnIcon = document.getElementById('generateBtnIcon');
            if (generateBtnIcon && window.insertIcon) {
                generateBtnIcon.innerHTML = insertIcon('sparkles', 'icon-only');
            }
        });
    </script>
</body>

</html>
