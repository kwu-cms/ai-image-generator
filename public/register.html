<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 - AI画像生成アプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI画像生成アプリ</h1>
            <nav>
                <a href="index.html">画像生成</a>
                <a href="history.html">履歴</a>
                <a href="guide.html">ガイド</a>
                <a href="login.html">ログイン</a>
            </nav>
        </header>

        <main>
            <section class="auth-section">
                <h2>ユーザー登録</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="ka225053@konan-wu.ac.jp または k1524005@konan-wu.ac.jp"
                            required
                        />
                        <small>例: ka225053@konan-wu.ac.jp（2025年度以降）または k1524005@konan-wu.ac.jp（それ以前）</small>
                    </div>
                    <div class="form-group">
                        <label for="studentId">学籍番号</label>
                        <input 
                            type="text" 
                            id="studentId" 
                            name="studentId" 
                            placeholder="a225053 または 1524005"
                            required
                            pattern="^(a\d{6}|\d{7})$"
                        />
                        <small>2025年度以降: a225053、それ以前: 1524005</small>
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="4文字以上12文字以下"
                            required
                            minlength="4"
                            maxlength="12"
                        />
                        <small>4文字以上12文字以下で入力してください</small>
                    </div>
                    <div class="form-group">
                        <label for="passwordConfirm">パスワード（確認）</label>
                        <input 
                            type="password" 
                            id="passwordConfirm" 
                            name="passwordConfirm" 
                            placeholder="同じパスワードを入力"
                            required
                            minlength="4"
                            maxlength="12"
                        />
                    </div>
                    <button type="submit" id="registerBtn" class="btn-primary">
                        登録
                    </button>
                </form>
                <div class="auth-links">
                    <p>既にアカウントをお持ちの方は <a href="login.html">こちらからログイン</a></p>
                </div>
                <div id="errorSection" class="error-section" style="display: none;">
                    <div class="error-message" id="errorMessage"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 AI画像生成アプリ</p>
        </footer>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
