# Cloudflare Workers設定ファイル

name = "image-generation-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# D1データベース設定
[[d1_databases]]
binding = "DB"
database_name = "image-generation-db"
database_id = "d5738698-efff-441e-9b40-938939bdee9a"

# R2ストレージ設定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "image-generation-storage"

# Workers KV設定（セッション管理用）
# 実装時に `wrangler kv:namespace create "SESSIONS"` で作成後、
# 以下の行のコメントを外してnamespace_idを設定してください
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id-here"

# 環境変数（Secretsは `wrangler secret put` で設定）
# OPENAI_API_KEY - Workers Secretsで設定
# R2_ACCOUNT_ID - Workers Secretsで設定（必要に応じて）
# R2_ACCESS_KEY_ID - Workers Secretsで設定（必要に応じて）
# R2_SECRET_ACCESS_KEY - Workers Secretsで設定（必要に応じて）
